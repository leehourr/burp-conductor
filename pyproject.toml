[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burp-conductor"
version = "0.1.0"
description = "MCP safety-wrapper and engagement spine around PortSwigger's Burp MCP extension; usable from any MCP-capable AI harness (Claude Code, Codex, Cline, Cursor, ...)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.scripts]
burp-stdio = "server:main"
burp-conductor = "cli:main"

[tool.setuptools]
py-modules = ["safety", "persist", "server", "cli"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["templates/*.yaml", ".claude/commands/*.md"]
