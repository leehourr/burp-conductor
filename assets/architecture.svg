<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="t d" font-family="'Geist','Helvetica Neue',Arial,sans-serif">
  <title id="t">burp-conductor engagement lifecycle</title>
  <desc id="d">Tool surface band on top feeds seven engagement phases arranged left to right — Scoping, Recon, Auth, Access, Inject, Roundout, Report. The Report phase is the focal outcome. Below, a safety spine enforces scope, HITL, quarantine, confinement, auth scrub, and identity on every call.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6f80"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <text x="60" y="56" font-family="Georgia,'Instrument Serif',serif" font-style="italic" font-size="44" fill="#2d3142">burp-conductor engagement lifecycle</text>
  <text x="60" y="84" font-family="ui-monospace,'Geist Mono',monospace" font-size="15" letter-spacing="2" fill="#6b6f80">SCOPING · RECON · AUTH · ACCESS · INJECT · ROUNDOUT · REPORT</text>

  <!-- Tool surface band -->
  <rect x="60" y="112" width="1480" height="96" rx="8" fill="none" stroke="#6b6f80" stroke-width="1.5"/>
  <text x="80" y="140" font-family="ui-monospace,monospace" font-size="14" letter-spacing="2" fill="#6b6f80">TOOL SURFACE — INVOKED BY EVERY PHASE</text>
  <text x="80" y="176" font-size="20" font-weight="600" fill="#2d3142">BURP MCP</text>
  <text x="212" y="176" font-family="ui-monospace,monospace" font-size="17" fill="#2d3142">26 tools · streamable HTTP 127.0.0.1:9876/mcp</text>
  <text x="760" y="176" font-size="20" font-weight="600" fill="#2d3142">FREE STACK</text>
  <text x="904" y="176" font-family="ui-monospace,monospace" font-size="17" fill="#2d3142">katana · nuclei · interactsh · diff_fuzz</text>

  <!-- feeds down to phase row -->
  <g stroke="#9a9ead" stroke-width="1.2" stroke-dasharray="4,5" fill="none">
    <line x1="170"  y1="208" x2="170"  y2="300"/>
    <line x1="370"  y1="208" x2="370"  y2="300"/>
    <line x1="570"  y1="208" x2="570"  y2="300"/>
    <line x1="770"  y1="208" x2="770"  y2="300"/>
    <line x1="970"  y1="208" x2="970"  y2="300"/>
    <line x1="1170" y1="208" x2="1170" y2="300"/>
    <line x1="1430" y1="208" x2="1430" y2="300"/>
  </g>

  <!-- arrows between phases (behind boxes) -->
  <g stroke="#6b6f80" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="265"  y1="352" x2="275"  y2="352"/>
    <line x1="465"  y1="352" x2="475"  y2="352"/>
    <line x1="665"  y1="352" x2="675"  y2="352"/>
    <line x1="865"  y1="352" x2="875"  y2="352"/>
    <line x1="1065" y1="352" x2="1075" y2="352"/>
    <line x1="1310" y1="352" x2="1340" y2="352"/>
  </g>

  <!-- phase boxes: w=180, h=104 -->
  <g>
    <!-- Scoping -->
    <rect x="80"  y="300" width="180" height="104" rx="8" fill="none" stroke="#6b6f80" stroke-width="1.5"/>
    <rect x="94"  y="312" width="66" height="22" rx="3" fill="#ecebe7"/>
    <text x="127" y="328" font-family="ui-monospace,monospace" font-size="12" letter-spacing="1.4" fill="#6b6f80" text-anchor="middle">PHASE 0</text>
    <text x="170" y="364" font-size="22" font-weight="600" fill="#2d3142" text-anchor="middle">Scoping</text>
    <text x="170" y="389" font-family="ui-monospace,monospace" font-size="13" fill="#6b6f80" text-anchor="middle">SCOPE.md · engagement.yaml</text>

    <!-- Recon -->
    <rect x="280" y="300" width="180" height="104" rx="8" fill="none" stroke="#6b6f80" stroke-width="1.5"/>
    <rect x="294" y="312" width="66" height="22" rx="3" fill="#ecebe7"/>
    <text x="327" y="328" font-family="ui-monospace,monospace" font-size="12" letter-spacing="1.4" fill="#6b6f80" text-anchor="middle">PHASE 1</text>
    <text x="370" y="364" font-size="22" font-weight="600" fill="#2d3142" text-anchor="middle">Recon</text>
    <text x="370" y="389" font-family="ui-monospace,monospace" font-size="13" fill="#6b6f80" text-anchor="middle">surface map · passive</text>

    <!-- Auth -->
    <rect x="480" y="300" width="180" height="104" rx="8" fill="none" stroke="#6b6f80" stroke-width="1.5"/>
    <rect x="494" y="312" width="66" height="22" rx="3" fill="#ecebe7"/>
    <text x="527" y="328" font-family="ui-monospace,monospace" font-size="12" letter-spacing="1.4" fill="#6b6f80" text-anchor="middle">PHASE 2</text>
    <text x="570" y="364" font-size="22" font-weight="600" fill="#2d3142" text-anchor="middle">Auth</text>
    <text x="570" y="389" font-family="ui-monospace,monospace" font-size="13" fill="#6b6f80" text-anchor="middle">tokens · rate-limit · jwt</text>

    <!-- Access -->
    <rect x="680" y="300" width="180" height="104" rx="8" fill="none" stroke="#6b6f80" stroke-width="1.5"/>
    <rect x="694" y="312" width="66" height="22" rx="3" fill="#ecebe7"/>
    <text x="727" y="328" font-family="ui-monospace,monospace" font-size="12" letter-spacing="1.4" fill="#6b6f80" text-anchor="middle">PHASE 3</text>
    <text x="770" y="364" font-size="22" font-weight="600" fill="#2d3142" text-anchor="middle">Access</text>
    <text x="770" y="389" font-family="ui-monospace,monospace" font-size="13" fill="#6b6f80" text-anchor="middle">IDOR · priv-esc</text>

    <!-- Inject -->
    <rect x="880" y="300" width="180" height="104" rx="8" fill="none" stroke="#6b6f80" stroke-width="1.5"/>
    <rect x="894" y="312" width="66" height="22" rx="3" fill="#ecebe7"/>
    <text x="927" y="328" font-family="ui-monospace,monospace" font-size="12" letter-spacing="1.4" fill="#6b6f80" text-anchor="middle">PHASE 4</text>
    <text x="970" y="364" font-size="22" font-weight="600" fill="#2d3142" text-anchor="middle">Inject</text>
    <text x="970" y="389" font-family="ui-monospace,monospace" font-size="13" fill="#6b6f80" text-anchor="middle">SQLi · XSS · SSRF · scan</text>

    <!-- Roundout -->
    <rect x="1080" y="300" width="230" height="104" rx="8" fill="none" stroke="#6b6f80" stroke-width="1.5"/>
    <rect x="1094" y="312" width="66" height="22" rx="3" fill="#ecebe7"/>
    <text x="1127" y="328" font-family="ui-monospace,monospace" font-size="12" letter-spacing="1.4" fill="#6b6f80" text-anchor="middle">PHASE 5</text>
    <text x="1195" y="364" font-size="22" font-weight="600" fill="#2d3142" text-anchor="middle">Roundout</text>
    <text x="1195" y="389" font-family="ui-monospace,monospace" font-size="13" fill="#6b6f80" text-anchor="middle">OWASP Top 10 sweep</text>

    <!-- Report (focal, coral) -->
    <rect x="1340" y="300" width="200" height="104" rx="8" fill="#f0d7cd" stroke="#bf4520" stroke-width="2"/>
    <rect x="1354" y="312" width="66" height="22" rx="3" fill="#ffffff"/>
    <text x="1387" y="328" font-family="ui-monospace,monospace" font-size="12" letter-spacing="1.4" fill="#bf4520" text-anchor="middle">PHASE 6</text>
    <text x="1440" y="364" font-size="22" font-weight="600" fill="#2d3142" text-anchor="middle">Report</text>
    <text x="1440" y="389" font-family="ui-monospace,monospace" font-size="13" fill="#6b6f80" text-anchor="middle">EN → Otoi-san → JP</text>
  </g>

  <!-- feeds down to safety spine -->
  <g stroke="#9a9ead" stroke-width="1.2" stroke-dasharray="4,5" fill="none">
    <line x1="170"  y1="404" x2="170"  y2="500"/>
    <line x1="370"  y1="404" x2="370"  y2="500"/>
    <line x1="570"  y1="404" x2="570"  y2="500"/>
    <line x1="770"  y1="404" x2="770"  y2="500"/>
    <line x1="970"  y1="404" x2="970"  y2="500"/>
    <line x1="1195" y1="404" x2="1195" y2="500"/>
    <line x1="1440" y1="404" x2="1440" y2="500"/>
  </g>

  <!-- Safety spine (focal) -->
  <rect x="60" y="500" width="1480" height="124" rx="8" fill="#f0d7cd" stroke="#bf4520" stroke-width="2"/>
  <text x="80" y="530" font-family="ui-monospace,monospace" font-size="14" letter-spacing="2" fill="#bf4520">SAFETY SPINE — ENFORCED ON EVERY CALL (MCP + FREE STACK)</text>
  <g font-family="ui-monospace,monospace" font-size="15" fill="#2d3142">
    <rect x="80"   y="552" width="220" height="44" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <text x="190"  y="580" text-anchor="middle">SCOPE</text>
    <rect x="320"  y="552" width="220" height="44" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <text x="430"  y="580" text-anchor="middle">HITL</text>
    <rect x="560"  y="552" width="220" height="44" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <text x="670"  y="580" text-anchor="middle">QUARANTINE</text>
    <rect x="800"  y="552" width="220" height="44" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <text x="910"  y="580" text-anchor="middle">CONFINEMENT</text>
    <rect x="1040" y="552" width="220" height="44" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <text x="1150" y="580" text-anchor="middle">AUTH-SCRUB</text>
    <rect x="1280" y="552" width="240" height="44" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="1.5"/>
    <text x="1400" y="580" text-anchor="middle">X-Pentest-ID</text>
  </g>

  <!-- terminal output under Report -->
  <line x1="1440" y1="624" x2="1440" y2="668" stroke="#bf4520" stroke-width="2" marker-end="url(#ac)"/>
  <g font-family="ui-monospace,monospace" font-size="15" fill="#2d3142">
    <text x="1440" y="692" text-anchor="middle">reports/&lt;slug&gt;/</text>
    <text x="1440" y="714" text-anchor="middle">report-draft-en.md · findings/*.md</text>
  </g>

  <!-- legend -->
  <g font-family="ui-monospace,monospace" font-size="14" fill="#6b6f80">
    <rect x="60"  y="672" width="20" height="20" rx="3" fill="#f0d7cd" stroke="#bf4520" stroke-width="1.5"/>
    <text x="90"  y="687">focal — final deliverable &amp; safety guarantee</text>
    <line x1="60" y1="716" x2="80" y2="716" stroke="#9a9ead" stroke-width="1.2" stroke-dasharray="4,5"/>
    <text x="90"  y="721">feeds / enforces every call</text>
    <line x1="340" y1="716" x2="370" y2="716" stroke="#6b6f80" stroke-width="2" marker-end="url(#a)"/>
    <text x="380" y="721">phase progression</text>
  </g>
</svg>
