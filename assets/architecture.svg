<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 880" role="img" aria-labelledby="t d" font-family="'Geist','Inter','Helvetica Neue',Arial,sans-serif">
  <title id="t">burp-conductor engagement lifecycle</title>
  <desc id="d">Tool surface band on top feeds seven engagement phases arranged left to right — Scoping, Recon, Auth, Access, Inject, Roundout, Report. The Report phase is the focal outcome. Below, a safety spine enforces scope, HITL, quarantine, confinement, auth scrub, and identity on every call.</desc>

  <style>
    .ink    { fill: #2d3142; }
    .muted  { fill: #6b6f80; }
    .soft   { stroke: #6b6f80; }
    .faint  { stroke: #9a9ead; }
    .accent-fill   { fill: #2563eb; }
    .accent-stroke { stroke: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e8ebf0; }
      .muted { fill: #a8adbb; }
      .soft  { stroke: #a8adbb; }
      .faint { stroke: #6b6f80; }
      .accent-fill   { fill: #60a5fa; }
      .accent-stroke { stroke: #60a5fa; }
      #arrow-head  path { fill: #a8adbb; }
      #arrow-acc   path { fill: #60a5fa; }
    }
  </style>

  <defs>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6f80"/>
    </marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="60" y="76" font-size="56" font-weight="700" class="ink">burp-conductor engagement lifecycle</text>
  <text x="60" y="118" font-size="22" letter-spacing="2" class="muted">SCOPING · RECON · AUTH · ACCESS · INJECT · ROUNDOUT · REPORT</text>

  <!-- Tool surface band -->
  <rect x="60" y="156" width="1680" height="128" rx="8" fill="none" class="soft" stroke-width="1.8"/>
  <text x="80" y="192" font-size="20" letter-spacing="2" class="muted">TOOL SURFACE — INVOKED BY EVERY PHASE</text>
  <text x="80" y="240" font-size="30" font-weight="600" class="ink">BURP MCP</text>
  <text x="270" y="240" font-size="22" class="ink">26 tools · streamable HTTP 127.0.0.1:9876/mcp</text>
  <text x="900" y="240" font-size="30" font-weight="600" class="ink">FREE STACK</text>
  <text x="1095" y="240" font-size="22" class="ink">katana · nuclei · interactsh · diff_fuzz</text>

  <!-- feeds down to phase row -->
  <g stroke-width="1.4" stroke-dasharray="4,5" fill="none" class="faint">
    <line x1="195"  y1="284" x2="195"  y2="372"/>
    <line x1="418"  y1="284" x2="418"  y2="372"/>
    <line x1="641"  y1="284" x2="641"  y2="372"/>
    <line x1="864"  y1="284" x2="864"  y2="372"/>
    <line x1="1087" y1="284" x2="1087" y2="372"/>
    <line x1="1322" y1="284" x2="1322" y2="372"/>
    <line x1="1595" y1="284" x2="1595" y2="372"/>
  </g>

  <!-- arrows between phases -->
  <g stroke-width="2.2" fill="none" class="soft" marker-end="url(#arrow-head)">
    <line x1="300"  y1="440" x2="316"  y2="440"/>
    <line x1="523"  y1="440" x2="539"  y2="440"/>
    <line x1="746"  y1="440" x2="762"  y2="440"/>
    <line x1="969"  y1="440" x2="985"  y2="440"/>
    <line x1="1192" y1="440" x2="1208" y2="440"/>
    <line x1="1450" y1="440" x2="1480" y2="440"/>
  </g>

  <!-- phase boxes: w=210, h=136 -->
  <g>
    <rect x="90"  y="372" width="210" height="136" rx="8" fill="none" class="soft" stroke-width="1.8"/>
    <rect x="106" y="388" width="90" height="30" rx="3" fill="none" class="soft" stroke-width="1.2"/>
    <text x="151" y="409" font-size="17" letter-spacing="1.4" class="muted" text-anchor="middle">PHASE 0</text>
    <text x="195" y="456" font-size="32" font-weight="600" class="ink" text-anchor="middle">Scoping</text>
    <text x="195" y="488" font-size="18" class="muted" text-anchor="middle">SCOPE.md · engagement.yaml</text>

    <rect x="313" y="372" width="210" height="136" rx="8" fill="none" class="soft" stroke-width="1.8"/>
    <rect x="329" y="388" width="90" height="30" rx="3" fill="none" class="soft" stroke-width="1.2"/>
    <text x="374" y="409" font-size="17" letter-spacing="1.4" class="muted" text-anchor="middle">PHASE 1</text>
    <text x="418" y="456" font-size="32" font-weight="600" class="ink" text-anchor="middle">Recon</text>
    <text x="418" y="488" font-size="18" class="muted" text-anchor="middle">surface map · passive</text>

    <rect x="536" y="372" width="210" height="136" rx="8" fill="none" class="soft" stroke-width="1.8"/>
    <rect x="552" y="388" width="90" height="30" rx="3" fill="none" class="soft" stroke-width="1.2"/>
    <text x="597" y="409" font-size="17" letter-spacing="1.4" class="muted" text-anchor="middle">PHASE 2</text>
    <text x="641" y="456" font-size="32" font-weight="600" class="ink" text-anchor="middle">Auth</text>
    <text x="641" y="488" font-size="18" class="muted" text-anchor="middle">tokens · rate-limit · jwt</text>

    <rect x="759" y="372" width="210" height="136" rx="8" fill="none" class="soft" stroke-width="1.8"/>
    <rect x="775" y="388" width="90" height="30" rx="3" fill="none" class="soft" stroke-width="1.2"/>
    <text x="820" y="409" font-size="17" letter-spacing="1.4" class="muted" text-anchor="middle">PHASE 3</text>
    <text x="864" y="456" font-size="32" font-weight="600" class="ink" text-anchor="middle">Access</text>
    <text x="864" y="488" font-size="18" class="muted" text-anchor="middle">IDOR · priv-esc</text>

    <rect x="982" y="372" width="210" height="136" rx="8" fill="none" class="soft" stroke-width="1.8"/>
    <rect x="998" y="388" width="90" height="30" rx="3" fill="none" class="soft" stroke-width="1.2"/>
    <text x="1043" y="409" font-size="17" letter-spacing="1.4" class="muted" text-anchor="middle">PHASE 4</text>
    <text x="1087" y="456" font-size="32" font-weight="600" class="ink" text-anchor="middle">Inject</text>
    <text x="1087" y="488" font-size="18" class="muted" text-anchor="middle">SQLi · XSS · SSRF · scan</text>

    <rect x="1205" y="372" width="245" height="136" rx="8" fill="none" class="soft" stroke-width="1.8"/>
    <rect x="1221" y="388" width="90" height="30" rx="3" fill="none" class="soft" stroke-width="1.2"/>
    <text x="1266" y="409" font-size="17" letter-spacing="1.4" class="muted" text-anchor="middle">PHASE 5</text>
    <text x="1327" y="456" font-size="32" font-weight="600" class="ink" text-anchor="middle">Roundout</text>
    <text x="1327" y="488" font-size="18" class="muted" text-anchor="middle">OWASP Top 10 sweep</text>

    <!-- Report (focal, blue) -->
    <rect x="1480" y="372" width="240" height="136" rx="8" fill="none" class="accent-stroke" stroke-width="2.8"/>
    <rect x="1496" y="388" width="90" height="30" rx="3" fill="none" class="accent-stroke" stroke-width="1.4"/>
    <text x="1541" y="409" font-size="17" letter-spacing="1.4" class="accent-fill" text-anchor="middle">PHASE 6</text>
    <text x="1600" y="456" font-size="32" font-weight="600" class="accent-fill" text-anchor="middle">Report</text>
    <text x="1600" y="488" font-size="18" class="muted" text-anchor="middle">EN → Otoi-san → JP</text>
  </g>

  <!-- feeds down to safety spine -->
  <g stroke-width="1.4" stroke-dasharray="4,5" fill="none" class="faint">
    <line x1="195"  y1="508" x2="195"  y2="596"/>
    <line x1="418"  y1="508" x2="418"  y2="596"/>
    <line x1="641"  y1="508" x2="641"  y2="596"/>
    <line x1="864"  y1="508" x2="864"  y2="596"/>
    <line x1="1087" y1="508" x2="1087" y2="596"/>
    <line x1="1327" y1="508" x2="1327" y2="596"/>
    <line x1="1600" y1="508" x2="1600" y2="596"/>
  </g>

  <!-- Safety spine (focal, blue) -->
  <rect x="60" y="596" width="1680" height="152" rx="8" fill="none" class="accent-stroke" stroke-width="2.8"/>
  <text x="80" y="632" font-size="20" letter-spacing="2" class="accent-fill">SAFETY SPINE — ENFORCED ON EVERY CALL (MCP + FREE STACK)</text>
  <g font-size="22" font-weight="600">
    <rect x="80"   y="656" width="250" height="60" rx="4" fill="none" class="accent-stroke" stroke-width="1.8"/>
    <text x="205"  y="694" text-anchor="middle" class="ink">SCOPE</text>
    <rect x="350"  y="656" width="250" height="60" rx="4" fill="none" class="accent-stroke" stroke-width="1.8"/>
    <text x="475"  y="694" text-anchor="middle" class="ink">HITL</text>
    <rect x="620"  y="656" width="250" height="60" rx="4" fill="none" class="accent-stroke" stroke-width="1.8"/>
    <text x="745"  y="694" text-anchor="middle" class="ink">QUARANTINE</text>
    <rect x="890"  y="656" width="250" height="60" rx="4" fill="none" class="accent-stroke" stroke-width="1.8"/>
    <text x="1015" y="694" text-anchor="middle" class="ink">CONFINEMENT</text>
    <rect x="1160" y="656" width="250" height="60" rx="4" fill="none" class="accent-stroke" stroke-width="1.8"/>
    <text x="1285" y="694" text-anchor="middle" class="ink">AUTH-SCRUB</text>
    <rect x="1430" y="656" width="290" height="60" rx="4" fill="none" class="accent-stroke" stroke-width="1.8"/>
    <text x="1575" y="694" text-anchor="middle" class="ink">X-Pentest-ID</text>
  </g>

  <!-- terminal output under Report -->
  <line x1="1600" y1="748" x2="1600" y2="788" stroke-width="2.4" class="accent-stroke" marker-end="url(#arrow-acc)"/>
  <text x="1600" y="820" text-anchor="middle" font-size="21" font-weight="600" class="ink">reports/&lt;slug&gt;/</text>
  <text x="1600" y="846" text-anchor="middle" font-size="18" class="muted">report-draft-en.md · findings/*.md</text>

  <!-- legend -->
  <g font-size="18">
    <rect x="60"  y="798" width="28" height="28" rx="3" fill="none" class="accent-stroke" stroke-width="2.2"/>
    <text x="100" y="819" class="muted">focal — final deliverable &amp; safety guarantee</text>
    <line x1="60" y1="858" x2="88" y2="858" stroke-width="1.4" stroke-dasharray="4,5" class="faint"/>
    <text x="100" y="864" class="muted">feeds / enforces every call</text>
    <line x1="450" y1="858" x2="484" y2="858" stroke-width="2.2" class="soft" marker-end="url(#arrow-head)"/>
    <text x="498" y="864" class="muted">phase progression</text>
  </g>
</svg>
