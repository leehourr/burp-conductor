<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 560" role="img" aria-labelledby="t d" font-family="'Geist','Helvetica Neue',Arial,sans-serif">
  <title id="t">burp-conductor engagement lifecycle</title>
  <desc id="d">Tool surface band on top feeds seven engagement phases arranged left to right — Scoping, Recon, Auth, Access, Inject, Roundout, Report. The Report phase is the focal outcome. Below, a safety spine enforces scope, HITL, quarantine, confinement, auth scrub, and identity on every call.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6f80"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="560" fill="#f5f5f5"/>

  <text x="52" y="40" font-family="Georgia,'Instrument Serif',serif" font-style="italic" font-size="30" fill="#2d3142">burp-conductor engagement lifecycle</text>
  <text x="52" y="60" font-family="ui-monospace,'Geist Mono',monospace" font-size="10" letter-spacing="1.4" fill="#6b6f80">SCOPING · RECON · AUTH · ACCESS · INJECT · ROUNDOUT · REPORT</text>

  <!-- Tool surface band -->
  <rect x="52" y="82" width="1216" height="72" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
  <text x="72" y="104" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.4" fill="#9a9ead">TOOL SURFACE — INVOKED BY EVERY PHASE</text>
  <text x="72" y="130" font-size="14" font-weight="600" fill="#2d3142">BURP MCP</text>
  <text x="160" y="130" font-family="ui-monospace,monospace" font-size="12" fill="#6b6f80">26 tools · streamable HTTP 127.0.0.1:9876/mcp</text>
  <text x="560" y="130" font-size="14" font-weight="600" fill="#2d3142">FREE STACK</text>
  <text x="660" y="130" font-family="ui-monospace,monospace" font-size="12" fill="#6b6f80">katana · nuclei · interactsh · diff_fuzz</text>

  <!-- feeds down to phase row -->
  <g stroke="#9a9ead" stroke-dasharray="3,4" fill="none">
    <line x1="150"  y1="154" x2="150"  y2="230"/>
    <line x1="320"  y1="154" x2="320"  y2="230"/>
    <line x1="490"  y1="154" x2="490"  y2="230"/>
    <line x1="660"  y1="154" x2="660"  y2="230"/>
    <line x1="830"  y1="154" x2="830"  y2="230"/>
    <line x1="1000" y1="154" x2="1000" y2="230"/>
    <line x1="1170" y1="154" x2="1170" y2="230"/>
  </g>

  <!-- arrows between phases (behind boxes) -->
  <g stroke="#6b6f80" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="225"  y1="266" x2="245"  y2="266"/>
    <line x1="395"  y1="266" x2="415"  y2="266"/>
    <line x1="565"  y1="266" x2="585"  y2="266"/>
    <line x1="735"  y1="266" x2="755"  y2="266"/>
    <line x1="905"  y1="266" x2="925"  y2="266"/>
    <line x1="1075" y1="266" x2="1095" y2="266"/>
  </g>

  <!-- phase boxes -->
  <g>
    <!-- Scoping -->
    <rect x="75" y="230" width="150" height="72" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
    <rect x="83" y="238" width="54" height="16" rx="2" fill="#ecebe7"/>
    <text x="110" y="250" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1" fill="#6b6f80" text-anchor="middle">PHASE 0</text>
    <text x="150" y="277" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">Scoping</text>
    <text x="150" y="294" font-family="ui-monospace,monospace" font-size="10" fill="#9a9ead" text-anchor="middle">SCOPE.md · engagement.yaml</text>

    <!-- Recon -->
    <rect x="245" y="230" width="150" height="72" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
    <rect x="253" y="238" width="54" height="16" rx="2" fill="#ecebe7"/>
    <text x="280" y="250" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1" fill="#6b6f80" text-anchor="middle">PHASE 1</text>
    <text x="320" y="277" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">Recon</text>
    <text x="320" y="294" font-family="ui-monospace,monospace" font-size="10" fill="#9a9ead" text-anchor="middle">surface map · passive</text>

    <!-- Auth -->
    <rect x="415" y="230" width="150" height="72" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
    <rect x="423" y="238" width="54" height="16" rx="2" fill="#ecebe7"/>
    <text x="450" y="250" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1" fill="#6b6f80" text-anchor="middle">PHASE 2</text>
    <text x="490" y="277" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">Auth</text>
    <text x="490" y="294" font-family="ui-monospace,monospace" font-size="10" fill="#9a9ead" text-anchor="middle">tokens · rate-limit · jwt</text>

    <!-- Access -->
    <rect x="585" y="230" width="150" height="72" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
    <rect x="593" y="238" width="54" height="16" rx="2" fill="#ecebe7"/>
    <text x="620" y="250" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1" fill="#6b6f80" text-anchor="middle">PHASE 3</text>
    <text x="660" y="277" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">Access</text>
    <text x="660" y="294" font-family="ui-monospace,monospace" font-size="10" fill="#9a9ead" text-anchor="middle">IDOR · priv-esc</text>

    <!-- Inject -->
    <rect x="755" y="230" width="150" height="72" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
    <rect x="763" y="238" width="54" height="16" rx="2" fill="#ecebe7"/>
    <text x="790" y="250" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1" fill="#6b6f80" text-anchor="middle">PHASE 4</text>
    <text x="830" y="277" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">Inject</text>
    <text x="830" y="294" font-family="ui-monospace,monospace" font-size="10" fill="#9a9ead" text-anchor="middle">SQLi · XSS · SSRF · scan</text>

    <!-- Roundout -->
    <rect x="925" y="230" width="150" height="72" rx="6" fill="#ffffff" stroke="#d9d7d0"/>
    <rect x="933" y="238" width="54" height="16" rx="2" fill="#ecebe7"/>
    <text x="960" y="250" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1" fill="#6b6f80" text-anchor="middle">PHASE 5</text>
    <text x="1000" y="277" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">Roundout</text>
    <text x="1000" y="294" font-family="ui-monospace,monospace" font-size="10" fill="#9a9ead" text-anchor="middle">OWASP Top 10 sweep</text>

    <!-- Report (focal, coral) -->
    <rect x="1095" y="230" width="150" height="72" rx="6" fill="#f0d7cd" stroke="#bf4520" stroke-width="1.5"/>
    <rect x="1103" y="238" width="54" height="16" rx="2" fill="#ffffff"/>
    <text x="1130" y="250" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1" fill="#bf4520" text-anchor="middle">PHASE 6</text>
    <text x="1170" y="277" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">Report</text>
    <text x="1170" y="294" font-family="ui-monospace,monospace" font-size="10" fill="#6b6f80" text-anchor="middle">EN draft → Otoi-san → JP</text>
  </g>

  <!-- feeds down to safety spine -->
  <g stroke="#9a9ead" stroke-dasharray="3,4" fill="none">
    <line x1="150"  y1="302" x2="150"  y2="380"/>
    <line x1="320"  y1="302" x2="320"  y2="380"/>
    <line x1="490"  y1="302" x2="490"  y2="380"/>
    <line x1="660"  y1="302" x2="660"  y2="380"/>
    <line x1="830"  y1="302" x2="830"  y2="380"/>
    <line x1="1000" y1="302" x2="1000" y2="380"/>
    <line x1="1170" y1="302" x2="1170" y2="380"/>
  </g>

  <!-- Safety spine (focal) -->
  <rect x="52" y="380" width="1216" height="88" rx="6" fill="#f0d7cd" stroke="#bf4520" stroke-width="1.5"/>
  <text x="72" y="404" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.4" fill="#bf4520">SAFETY SPINE — ENFORCED ON EVERY CALL (MCP + FREE STACK)</text>
  <g font-family="ui-monospace,monospace" font-size="11" fill="#2d3142">
    <rect x="72"   y="422" width="170" height="30" rx="2" fill="#ffffff" stroke="#bf4520"/>
    <text x="157"  y="442" text-anchor="middle">SCOPE</text>
    <rect x="262"  y="422" width="170" height="30" rx="2" fill="#ffffff" stroke="#bf4520"/>
    <text x="347"  y="442" text-anchor="middle">HITL</text>
    <rect x="452"  y="422" width="170" height="30" rx="2" fill="#ffffff" stroke="#bf4520"/>
    <text x="537"  y="442" text-anchor="middle">QUARANTINE</text>
    <rect x="642"  y="422" width="170" height="30" rx="2" fill="#ffffff" stroke="#bf4520"/>
    <text x="727"  y="442" text-anchor="middle">CONFINEMENT</text>
    <rect x="832"  y="422" width="170" height="30" rx="2" fill="#ffffff" stroke="#bf4520"/>
    <text x="917"  y="442" text-anchor="middle">AUTH-SCRUB</text>
    <rect x="1022" y="422" width="176" height="30" rx="2" fill="#ffffff" stroke="#bf4520"/>
    <text x="1110" y="442" text-anchor="middle">IDENTITY (X-Pentest-ID)</text>
  </g>

  <!-- terminal output under Report -->
  <line x1="1170" y1="468" x2="1170" y2="496" stroke="#bf4520" stroke-width="1.5" marker-end="url(#ac)"/>
  <g font-family="ui-monospace,monospace" font-size="11" fill="#6b6f80">
    <text x="1170" y="512" text-anchor="middle">reports/&lt;slug&gt;/</text>
    <text x="1170" y="528" text-anchor="middle">report-draft-en.md · findings/*.md</text>
  </g>

  <!-- legend -->
  <g font-family="ui-monospace,monospace" font-size="10" fill="#6b6f80">
    <rect x="52" y="500" width="14" height="14" rx="2" fill="#f0d7cd" stroke="#bf4520"/>
    <text x="74" y="511">focal — final deliverable &amp; safety guarantee</text>
    <line x1="52" y1="530" x2="66" y2="530" stroke="#9a9ead" stroke-dasharray="3,4"/>
    <text x="74" y="534">feeds / enforces every call</text>
    <line x1="260" y1="530" x2="280" y2="530" stroke="#6b6f80" marker-end="url(#a)"/>
    <text x="290" y="534">phase progression</text>
  </g>
</svg>
